# Aurora Binaural presets (P0 draft)
# Strength endpoints are at s=1. s=0 is a full bypass (not a point on the line).
# Width and the side feed interpolate from the *_at_0 floors.
#
# The side feed is a seeded interaural delay of L−R, not a dry/wet mix and
# not the old Schroeder allpass cascade. Delays sit off the 5 ms and 8 ms
# autocorrelation peaks of the music side-signal (mostly 500 Hz–2 kHz).
# Cascaded allpasses left that side bus near IACC 0.47, so the mix did not widen.
#
# direct_bleed_at_1 moves a fraction of the coherent mask onto the rear bed.
# ambient_ratio only used to repartition the incoherent residual, which is
# ~12% of music, so raising it did not change broadband IACC.
#
# pan_gamma < 1 pushes small L/R imbalances outward inside ±width. g=0
# (a centered voice) stays on the center sector.
#
# hf_pan_* collapses sector azimuth from hf_pan_start_hz up, down to
# hf_pan_floor times the strength width. Floor 0 puts the direct object
# on the center sector. The 500 Hz–2 kHz image is left alone because that
# is where broadband IACC lives.
#
# hf_direct_* fades the upmix mask to a frontal direct object between the
# two frequencies. Lateral HRTFs darken a quiet top octave in the mono
# downmix; voice is already frontal there. The ramp is a function of bin
# frequency only.
#
# bed_peak_* would lift only the wide/rear bed. That made uncorrelated
# pink bright near 1.25 kHz while a frontal piano did not follow, so a
# pink-mean inverse then cut the piano. Room leaves it at 0. The common
# bed coloration is left for the pink-derived fixed EQ.
#
# side_lpf_hz is a zero-phase raised-cosine fade on the side feed
# (flat below hz-500, gone by hz+500). The side's top octave was
# brightening incoherent material. A minimum-phase lowpass pulls the
# interaural delay back inside ±1 ms and the widening disappears.
#
# [fixed_eq] is filled by qa/p0/cursor/tools/design_fixed_eq.py. The target is the
# inverse of the mean 1/3-octave error of broadband pink rendered through
# three fixed correlations (mono copy, ρ ≈ 0.6, uncorrelated), clamped to
# ±6 dB. Real recordings are not an input. At runtime the FIR depends on
# HRTF, eq mode, preset and strength, not on the program.


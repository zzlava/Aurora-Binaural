# Route V presets. V3 is the product default: anchor G with a stronger
# height layer. Listening round 3 picked V3 at strength 1.0. V2 is that
# anchor (wide field, four height speakers, ceiling reflections) with the
# voice kept closer than the room. V1 is the same space with the voice
# farther, so the closeness can be checked.
#
# Catalog metadata. Both DSP loaders ignore these fields. Codex's preset
# catalog reads them:
#   default_preset = "<id>"
#       Root string. The one product default. It must name a preset table.
#   name = "<label>"
#       User-facing label on that preset table.
#   description = "<one sentence>"
#       User-facing sentence on that preset table.
#   default_strength = <number from 0 to 1>
#       Slider default for that preset. Omit it and the catalog keeps 0.5.
# None of these four fields is a speaker, room, or EQ parameter.
#
# strength scales wide / surround / height / early / late gains linearly
# and opens front_az from 30 degrees to front_az. strength 0 bypasses.
# It does not scale center_distance_m or direct_room_send_db: those are
# the voice-distance controls, not the space intensity.
#
# Five macro controls (ADR 0005), each in [0, 1], live under [macros].
# width / height / room / voice_distance are linear and anchored on the
# preset: value = clamp(stored + (control - default) * per_unit, min, max).
# At the default written in [V1.controls] / [V2.controls] / [V3.controls]
# the stored number is returned unchanged, so expanding those defaults
# reproduces the preset. strength is applied afterwards, exactly as above.
# 0 on voice_distance is the near end of that line.
#
# direct_room_send_db is how many dB the coherent direct path (the voice
# body) is turned down before it enters early reflections and the FDN,
# relative to the incoherent bed. center_distance_m sets a mild proximity
# shelf and parallax ILD on the center pair. center_spread_deg is the
# half-angle of that pair; it stays inside front_az.
#
# room_db is the late-reverb gain in dB against the direct speakers
# (negative means a higher direct-to-reverb ratio). early_db is the same
# for the image-source taps. [layout] is the shared G baseline; each
# preset only writes what it changes.

version = 1
default_preset = "V3"

[engine]
decorrelator_delays_ms = [3.2, 6.4, 10.0, 13.5, 4.4, 7.6, 11.2, 14.8, 3.8, 6.0, 9.2, 12.4]

[layout]
front_az = 45.0
wide_az = 90.0
surround_az = 130.0
wide_db = 1.0
surround_db = -4.0
surround_delay_ms = 18.0
height_el = 45.0
height_az = [45.0, -45.0, 135.0, -135.0]
height_db = -6.0
height_direct_db = -14.0
center_height_db = -22.0
height_rear_delay_ms = 12.0
direct_height_delay_ms = 9.0
center_distance_m = 0.90
center_spread_deg = 28.0
center_far_m = 2.0
direct_room_send_db = -8.0
early_db = 7.0
room_db = 4.0
t60 = 0.95
ceiling_db = 4.0
floor_db = 0.0
crossover_hz = 150.0
coherence_floor = 0.22
coherence_power = 2.0
pan_gamma = 1.0
absorption = 0.22
early_order = 1
early_taps = 12
room_size_m = [7.0, 4.6, 2.7]
listener_m = [2.2, 2.3, 1.25]
source_m = [4.8, 2.3, 1.25]
hrtf_ref_m = 1.5
near_lf_hz = 280.0
near_lf_max_db = 4.0
near_ild_scale = 1.0

# Linear curves. per_unit is the change for one full step of the control.
# min / max are the safety limits (ADR 0005). The limiter stays on.
[macros.strength]
curve = "linear"
front_az_at_0 = 30.0
front_az_max = 60.0
scales = ["wide_db", "surround_db", "height_db", "early_db", "room_db"]

[macros.width.front_az]
curve = "linear"
per_unit = 30.0
min = 30.0
max = 60.0

[macros.width.wide_db]
curve = "linear"
per_unit = 14.0
min = -12.0
max = 8.0

[macros.width.surround_db]
curve = "linear"
per_unit = 16.0
min = -18.0
max = 4.0

[macros.height.height_db]
curve = "linear"
per_unit = 8.0
min = -12.0
max = 2.0

[macros.height.height_el]
curve = "linear"
per_unit = 20.0
min = 30.0
max = 70.0

[macros.height.ceiling_db]
curve = "linear"
per_unit = 4.0
min = 0.0
max = 10.0

[macros.height.height_direct_db]
curve = "linear"
per_unit = 8.0
min = -20.0
max = -6.0

[macros.room.room_db]
curve = "linear"
per_unit = 16.0
min = -12.0
max = 16.0

[macros.room.t60]
curve = "linear"
per_unit = 1.0
min = 0.3
max = 1.8

[macros.voice_distance.center_distance_m]
curve = "linear"
per_unit = 2.6
min = 0.2
max = 3.2

[macros.voice_distance.direct_room_send_db]
curve = "linear"
per_unit = 16.0
min = -18.0
max = 6.0

[V2]
name = "沉浸·人声贴近"
description = "宽声场和头顶都在，人声贴在近处，高度比推荐档轻一些。"

[V2.controls]
strength = 1.0
width = 0.5
height = 0.25
room = 0.5
voice_distance = 0.25

[V1]
name = "开阔·人声稍远"
description = "同一套空间，人声站得稍远，声场听起来更开。"
center_distance_m = 2.20
center_spread_deg = 45.0
direct_room_send_db = 0.0

[V1.controls]
strength = 1.0
width = 0.5
height = 0.25
room = 0.5
voice_distance = 0.75

[V3]
name = "沉浸·头顶环绕（推荐）"
description = "人声贴近，头顶和四周更明显，建议从满强度开始听。"
default_strength = 1.0
height_db = -2.0
height_el = 55.0
ceiling_db = 6.0
height_direct_db = -10.0

[V3.controls]
strength = 1.0
width = 0.5
height = 0.75
room = 0.5
voice_distance = 0.25


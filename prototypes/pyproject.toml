[project]
name = "aurora-binaural-prototypes"
version = "0.1.0"
description = "P0 offline rendering-route prototypes for Aurora Binaural"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "sofar>=1.2",
    "spaudiopy>=0.2",
    "pyfar>=0.7",
    "pyloudnorm>=0.1.1",
]

[project.scripts]
run-p0 = "run_p0:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora_p0"]

[tool.uv]
package = true

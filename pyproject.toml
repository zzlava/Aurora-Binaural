[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "aurora_binaural"
version = "0.1.0"
description = "Aurora Binaural application layer (CLI, API, Worker, GUI) and codec timeline verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
]

[project.scripts]
aurora = "aurora_binaural.cli:main"

[dependency-groups]
core-build = [
    "maturin>=1.9.0,<2.0.0",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_binaural"]

[tool.hatch.build.targets.wheel.force-include]
"presets" = "aurora_binaural/_data/presets"
"data/hrtf/sadie2_d1" = "aurora_binaural/_data/hrtf/sadie2_d1"
"data/hrtf/sadie_d1_frontal.ahrp" = "aurora_binaural/_data/hrtf/sadie_d1_frontal.ahrp"
"deploy/licenses" = "aurora_binaural/_data/licenses"
"deploy/THIRD_PARTY_NOTICES.md" = "aurora_binaural/_data/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/presets", "/deploy/licenses", "/deploy/THIRD_PARTY_NOTICES.md",
    "/README.md", "/pyproject.toml", "/data/hrtf/sadie2_d1",
    "/data/hrtf/sadie_d1_frontal.ahrp",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests/app"]
include = ["pyproject.toml", "src/**/*.py", "tests/app/**/*.py"]
extend-exclude = ["core", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
files = ["src", "tests/app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/app"]
addopts = "-q"

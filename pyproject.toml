[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "aurora_binaural"
version = "0.1.0"
description = "Aurora Binaural application layer (CLI, API, Worker, GUI) and codec timeline verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0,<3.0.0",
]

[project.scripts]
aurora = "aurora_binaural.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cli/aurora_binaural", "api", "worker"]

[tool.hatch.build.targets.wheel.sources]
"cli/aurora_binaural" = "aurora_binaural"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["cli", "api", "worker"]
include = ["pyproject.toml", "cli/**/*.py", "api/**/*.py", "worker/**/*.py"]
extend-exclude = ["core", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["cli"]
files = ["cli", "api", "worker"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
addopts = "-q"
